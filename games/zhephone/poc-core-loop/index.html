<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zhephone — core loop PoC</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font-family: system-ui, sans-serif; color: #e6edf5; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(10, 14, 20, 0.75); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; max-width: 340px;
  }
  #hud b { color: #fff; }
  #legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  #bars { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
  .bar-row { background: rgba(10, 14, 20, 0.75); padding: 6px 10px; border-radius: 6px; font-size: 12px; width: 200px; }
  .bar-track { background: #222; border-radius: 4px; height: 8px; margin-top: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: #5fd97a; transition: width 0.15s; }
  .bar-fill.enemy { background: #ff5f5f; }
  #log {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    background: rgba(10, 14, 20, 0.75); padding: 8px 12px; border-radius: 8px;
    font-size: 12px; width: 420px; max-height: 160px; overflow-y: auto;
  }
  #log div { opacity: 0.9; }
  #controls { position: fixed; bottom: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; }
  button {
    background: rgba(20, 30, 45, 0.9); color: #e6edf5; border: 1px solid #3a4f6a;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  button:hover { background: rgba(40, 60, 90, 0.9); }
  button:active { transform: scale(0.96); }
  button.armed { background: #3d6fa8; border-color: #6fa8e0; }
</style>
</head>
<body>
<div id="hud">
  <div><b>zhephone — core loop PoC</b></div>
  <div>Click an adjacent empty tile to move. Click an adjacent red-clan token to attack. No dice — damage is always the same fixed formula.</div>
  <div id="legend" style="margin-top:6px">
    <span style="background:#5fb2ff"></span>You (Blue Clan)
    <span style="background:#5fb2ff;margin-left:10px"></span>Ally (Blue Clan, unattackable)
    <span style="background:#ff5f5f;margin-left:10px"></span>Rival (Red Clan, attackable)
  </div>
</div>
<div id="bars"></div>
<div id="log"></div>
<div id="controls">
  <button id="block-btn" type="button">Queue Block (B)</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
