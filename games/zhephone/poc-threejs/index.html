<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zhephone — three.js tile-world PoC</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font-family: system-ui, sans-serif; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    color: #cfe3ff; background: rgba(10, 14, 20, 0.7);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5;
    max-width: 320px; pointer-events: none;
  }
  #hud b { color: #fff; }
  canvas { display: block; }
  #fullscreen-btn {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    color: #cfe3ff; background: rgba(10, 14, 20, 0.7); border: 1px solid #2c3f56;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-family: inherit;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  #fullscreen-btn:hover { background: rgba(30, 45, 65, 0.9); }
  #fullscreen-btn:active { transform: scale(0.96); }
</style>
</head>
<body>
<div id="hud">
  <div><b>zhephone — tile-world PoC</b></div>
  <div>Drag to orbit &middot; scroll to zoom &middot; hover to preview, click a tile to flag it &middot; F for fullscreen</div>
  <div id="selected">Selected tile: none</div>
</div>
<button id="fullscreen-btn" type="button">&#x26F6; Fullscreen</button>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
